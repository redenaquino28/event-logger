name: Run lint and Some tests

on:
  push:
    branches-ignore: [ "main" ]

env:
  REGION: ap-southeast-1
  ACCOUNT_ID: 297416720645

jobs:
  tflint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/terraform-linters/tflint:latest
    permissions:
      id-token: write 
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/event-logger-github-pipeline-role
          aws-region: ap-southeast-1

      - name: Verify TFLint
        run: tflint --version

      - name: Run TFLint to terraform module for Base Environment
        run: |
          cd terraform/env/dev
          tflint --init
          tflint

      - name: Run TFLint to terraform module for Lambda Function
        run: |
          cd terraform/lambda/dev
          tflint --init
          tflint

  terraform-validate:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.9.1
    permissions:
      id-token: write 
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/event-logger-github-pipeline-role
          aws-region: ap-southeast-1

      - name: Terraform version
        run: terraform version

      - name: Terraform validate module for Base Environment
        run: |
          cd terraform/env/dev
          terraform init
          terraform validate
  
      - name: Terraform validate module for Lambda Function
        run: |
          cd terraform/lambda/dev
          terraform init
          terraform validate