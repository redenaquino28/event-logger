name: Destroy

on:
  push:
    branches: [ "destroy" ]

env:
  REGION: ap-southeast-1
  ACCOUNT_ID: 297416720645
  IMAGE_NAME: event-logger
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.9.1
    permissions:
      id-token: write 
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/event-logger-github-pipeline-role
          aws-region: ap-southeast-1

      - name: Terraform version
        run: terraform version

      - name: Terraform destroy
        run: |
          cd terraform/lambda/dev
          terraform init
          terraform validate
          terraform destroy -var="image_tag=latest" -auto-approve
