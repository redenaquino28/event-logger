name: Build Docker Image for Event Logger API

on:
  push:
    branches: [ "main", "feat/workflow", "feat/event-logger-app"]

env:
  REGION: ap-southeast-1
  ACCOUNT_ID: 297416720645
  IMAGE_NAME: event-logger
  IMAGE_TAG: latest

jobs:
  build-publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
    permissions:
      id-token: write 
      contents: read

    steps:
      - name: Checkout Event Logger Repository
        uses: actions/checkout@v4

      - name: Set short commit hash
        id: set_tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$SHORT_SHA" >> $GITHUB_ENV

      - name: Build Docker image for Event Logger API
        run: |
          docker build -t $IMAGE_NAME:${{ steps.set_tag.outputs.tag }} -f application/Dockerfile .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/event-logger-github-pipeline-role
          aws-region: ap-southeast-1

      - name: Log in to AWS ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region $REGION \
            | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Push Docker image to ECR
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG
          docker push $ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG

  
  deploy:
    runs-on: ubuntu-latest
    needs: build-publish
    env:
      IMAGE_TAG: ${{ needs.build-publish.outputs.image_tag }}
    container:
      image: hashicorp/terraform:1.9.1
    permissions:
      id-token: write 
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/event-logger-github-pipeline-role
          aws-region: ap-southeast-1

      - name: Terraform version
        run: terraform version

      - name: Terraform initialize and deploy
        run: |
          cd terraform/lambda/dev
          terraform init
          terraform validate
          terraform apply -var="image_tag=$IMAGE_TAG" -auto-approve