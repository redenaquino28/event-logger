name: Build Docker Image for Event Logger API

on:
  push:
    branches: [ "main", "feat/workflow" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGION: ap-southeast-1
      ACCOUNT_ID: 297416720645
      IMAGE_NAME: event-logger-api
      IMAGE_TAG: latest

    steps:
      - name: Checkout Event Logger Repository
        uses: actions/checkout@v4

      - name: Build Docker image for Event Logger API
        run: |
          docker build -t $IMAGE_NAME:IMAGE_TAG -f application/Dockerfile .
  
      - name: Run container and test
        run: |
          docker run -d -p 8000:8000 --name event-logger-api event-logger-api:latest
          sleep 5
          curl --fail http://localhost:8000/api/healthcheck || (docker logs event-logger-api && exit 1)

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::$ACCOUNT_ID:role/event-logger-github-pipeline-role
          aws-region: ap-southeast-1

      - name: Log in to AWS ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region $REGION \
            | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Push Docker image to ECR
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG
          docker push $ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG